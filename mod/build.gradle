plugins {
    id 'fabric-loom' version '1.10.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    // 이 모드는 믹신을 딱 하나 쓴다 — GameRendererMixin(진짜 8배 줌). 나머지 훅은 전부 공개
    // Fabric API 이벤트다. 믹신 컴파일과 refmap 생성은 fabric.mod.json의 "mixins" 항목이
    // cubeclient.mixins.json을 가리키는 것만으로 Loom이 자동 처리하므로, 여기에 따로 선언할
    // 설정은 없다 — 그래서 블록은 비어 있다.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    include implementation("com.google.code.gson:gson:2.11.0")

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    // Minecraft 1.21.4 requires Java 21 to run — this is not a style choice, the game will not
    // start on an older runtime. Matches VersionDetail.javaMajorVersion() for this version on
    // the launcher side.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.test {
    useJUnitPlatform()
}

tasks.processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
